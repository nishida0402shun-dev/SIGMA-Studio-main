name: Debug scripts tests

on:
  push:
    branches:
      - test/chatgpt-github-write

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/chatgpt-github-write
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Run scripts tests
        run: |
          set +e
          npm run test:scripts > scripts-test.log 2>&1
          code=$?
          echo "exit_code=$code" >> scripts-test.log
          gh issue create --repo "${{ github.repository }}" --title "Temporary scripts test diagnostics ${{ github.run_id }}" --body-file scripts-test.log
          exit $code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
