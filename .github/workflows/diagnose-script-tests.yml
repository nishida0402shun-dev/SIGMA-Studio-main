name: Diagnose individual scripts tests

on:
  push:
    branches:
      - test/chatgpt-github-write

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test:
          - scripts/audit-npm-tarballs.test.mjs
          - scripts/electron-dev-lifecycle.test.mjs
          - scripts/file-associations.test.mjs
          - scripts/release-content.test.mjs
          - scripts/release-version.test.mjs
          - scripts/viewer-build-paths.test.mjs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/chatgpt-github-write
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Run test
        run: |
          set +e
          node --test "${{ matrix.test }}" > result.log 2>&1
          code=$?
          printf '\nEXIT_CODE=%s\n' "$code" >> result.log
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: script-test-${{ strategy.job-index }}
          path: result.log
          if-no-files-found: error
