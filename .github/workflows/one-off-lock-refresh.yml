name: One-off lockfile refresh

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: contains(github.event.head_commit.message, 'update napi canvas for PDF rendering compatibility')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: rm -f package-lock.json
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --include=optional
      - run: git config user.name 'github-actions[bot]'
      - run: git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - run: git add package-lock.json && git commit -m 'chore: refresh lockfile after canvas update' && git push
