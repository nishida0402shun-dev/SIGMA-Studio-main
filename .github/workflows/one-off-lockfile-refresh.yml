name: One-off lockfile refresh

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: |
          rm -f .github/workflows/one-off-lockfile-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/one-off-lockfile-refresh.yml
          git commit -m "chore: refresh lockfile for Transformers.js 4.3.1"
          git push
