name: One-off dependency audit fix

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm audit fix --package-lock-only --ignore-scripts --no-fund || true
      - name: Report remaining audit issues
        run: npm audit --json > audit.json || true
      - name: Commit dependency updates and remove this workflow
        run: |
          rm -f .github/workflows/one-off-audit-fix.yml audit.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/one-off-audit-fix.yml
          if git diff --cached --quiet; then
            echo "No dependency changes required."
            exit 0
          fi
          git commit -m "chore: refresh dependency lockfile after security updates"
          git push
