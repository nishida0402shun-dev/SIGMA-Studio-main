name: Diagnose desktop checks

on:
  push:
    branches:
      - test/chatgpt-github-write

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v6
        with:
          ref: test/chatgpt-github-write
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: npm ci
        run: npm ci > step.log 2>&1
      - name: version check
        run: npm run version:check > step.log 2>&1
      - name: scripts
        run: npm run test:scripts > step.log 2>&1
      - name: next typegen
        run: npm exec --workspace @sigma-studio/desktop -- next typegen > step.log 2>&1
      - name: typecheck
        run: npm run typecheck > step.log 2>&1
      - name: lint
        run: npm run lint > step.log 2>&1
      - name: desktop tests
        run: npm --workspace @sigma-studio/desktop run test -- --maxWorkers=2 --testTimeout=30000 > step.log 2>&1
      - name: build
        run: npm run build > step.log 2>&1
      - name: electron build
        run: npm run electron:build > step.log 2>&1
      - name: upload final log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-diagnostic-log
          path: step.log
          if-no-files-found: warn
