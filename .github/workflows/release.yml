name: Release

# Builds the Windows desktop app and uploads its installer, update metadata,
# and blockmap to a GitHub Release. A normal push to main automatically bumps
# the patch version, creates the matching tag, and publishes the release.
# Version tags and manual dispatch remain supported. See docs/distribution.md
# for the full release checklist.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - beta

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.release.outputs.ref }}
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Prepare release ref
        id: release
        shell: bash
        run: |
          set -euo pipefail
          channel="stable"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="$(node -p "require('./package.json').version")"
            ref="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="$(node -p "require('./package.json').version")"
            ref="${GITHUB_SHA}"
            channel="${{ inputs.channel }}"
          else
            npm run version:set -- patch
            version="$(node -p "require('./package.json').version")"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json apps/desktop/package.json package-lock.json packages/viewer/package.json packages/editor/package.json examples/editor-react18/package.json
            git commit -m "chore(release): bump version to ${version}"
            git push origin HEAD:main
            git tag "v${version}"
            git push origin "v${version}"
            ref="v${version}"
          fi

          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"

  release:
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Resolve release channel
        id: channel
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" == *"-beta."* ]]; then
              channel="beta"
            else
              channel="stable"
            fi
          else
            channel="${{ needs.prepare.outputs.channel }}"
          fi
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"
          echo "SIGMA_STUDIO_BETA_BUILD=$([[ "${channel}" == "beta" ]] && echo true || echo false)" >> "${GITHUB_ENV}"

      - name: Set up Python for bundled OCR runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build bundled PP-StructureV3 runtime
        shell: bash
        working-directory: apps/desktop
        run: npm run ocr:runtime:build
        env:
          SIGMA_OCR_PLATFORM: win
          SIGMA_OCR_ARCH: x64

      # The release tag and all workspace versions must agree.
      - name: Validate release version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
              echo "tag ${GITHUB_REF_NAME} とSigma Studio version v${version}が一致しません。" >&2
              exit 1
            fi
          else
            echo "manual release: channel=${{ steps.channel.outputs.channel }} version=v${version}"
          fi
          if [[ "${{ steps.channel.outputs.channel }}" == "beta" && "${version}" != *"-beta."* ]]; then
            echo "Beta release requires a -beta.N package version (got ${version})." >&2
            exit 1
          fi
          if [[ "${{ steps.channel.outputs.channel }}" == "stable" && "${version}" == *"-beta."* ]]; then
            echo "Stable release cannot use a -beta.N package version." >&2
            exit 1
          fi
          npm run version:check

      - name: Install dependencies
        run: npm ci

      - name: Verify cross-process file locking
        run: npm --workspace @sigma-studio/desktop run test -- file-lock

      - name: Build renderer + electron bundle
        run: npm --workspace @sigma-studio/desktop run electron:prepare
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # electron-builder publishes the installer and blockmap concurrently. Ensure the
      # release exists first so both publisher tasks cannot race to create the same tag.
      - name: Ensure GitHub Release exists before publishing artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if ! gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            args=(--repo "${GITHUB_REPOSITORY}" --title "${tag}" --notes "Automated release for Sigma Studio ${version}.")
            if [[ "${{ steps.channel.outputs.channel }}" == "beta" ]]; then
              args+=(--prerelease)
            fi
            # The tag already exists for push/tag-triggered releases. Only manual branch dispatch needs an explicit commit target.
            if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${GITHUB_REF_TYPE}" != "tag" ]]; then
              args+=(--target "${{ needs.prepare.outputs.ref }}")
            fi
            gh release create "${tag}" "${args[@]}"
          fi

      - name: Build and publish Windows installer
        working-directory: apps/desktop
        run: npx --no-install electron-builder --win --publish always --config electron-builder.config.cjs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CONTENT_RULES: ${{ secrets.RELEASE_CONTENT_RULES }}
          SIGMA_STUDIO_REQUIRE_RELEASE_AUDIT: ${{ secrets.RELEASE_CONTENT_RULES != '' && 'true' || 'false' }}
          SIGMA_STUDIO_BETA_BUILD: ${{ steps.channel.outputs.channel == 'beta' && 'true' || 'false' }}

      - name: Install and launch Windows installer
        shell: pwsh
        working-directory: apps/desktop
        run: |
          $installer = Get-ChildItem -Path release -Filter '*.exe' | Where-Object { $_.Name -notmatch 'uninstaller' } | Select-Object -First 1
          if (-not $installer) { throw "Windows installer artifact was not found." }
          $installDir = Join-Path $env:RUNNER_TEMP 'sigma-studio-install'
          if (Test-Path $installDir) { Remove-Item -Recurse -Force $installDir }
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Windows installer exited with code $($process.ExitCode)." }
          $app = Join-Path $installDir 'Sigma Studio.exe'
          if (-not (Test-Path $app)) {
            $app = Get-ChildItem -Path $installDir -Filter '*.exe' -Recurse | Where-Object { $_.Name -notmatch 'unins|uninstall' } | Select-Object -First 1 | ForEach-Object FullName
          }
          if (-not $app -or -not (Test-Path $app)) { throw "Installed Sigma Studio executable was not found." }
          $launched = Start-Process -FilePath $app -PassThru
          Start-Sleep -Seconds 12
          if ($launched.HasExited -and $launched.ExitCode -ne 0) {
            throw "Sigma Studio exited during launch smoke test with code $($launched.ExitCode)."
          }
          if (-not $launched.HasExited) {
            Stop-Process -Id $launched.Id -Force
          }
