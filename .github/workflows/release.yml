name: Release

# Builds the desktop app for macOS and Windows and uploads installers, update
# metadata, and blockmaps to a GitHub Release. A normal push to main automatically
# bumps the patch version, creates the matching tag, and publishes the release.
# Version tags and manual dispatch remain supported. See docs/distribution.md
# for the full release checklist.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - beta

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.release.outputs.ref }}
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Prepare release ref
        id: release
        shell: bash
        run: |
          set -euo pipefail
          channel="stable"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="$(node -p "require('./package.json').version")"
            ref="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="$(node -p "require('./package.json').version")"
            ref="${GITHUB_SHA}"
            channel="${{ inputs.channel }}"
          else
            npm run version:set -- patch
            version="$(node -p "require('./package.json').version")"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json apps/desktop/package.json package-lock.json packages/viewer/package.json packages/editor/package.json examples/editor-react18/package.json
            git commit -m "chore(release): bump version to ${version}"
            git push origin HEAD:main
            git tag "v${version}"
            git push origin "v${version}"
            ref="v${version}"
          fi

          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"

  release:
    # A push to main only bumps the version and pushes its tag. The tag-triggered
    # run is the sole publisher, avoiding a second run for the same release.
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Resolve release channel
        id: channel
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" == *"-beta."* ]]; then
              channel="beta"
            else
              channel="stable"
            fi
          else
            channel="${{ needs.prepare.outputs.channel }}"
          fi
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"
          echo "SIGMA_STUDIO_BETA_BUILD=$([[ "${channel}" == "beta" ]] && echo true || echo false)" >> "${GITHUB_ENV}"

      - name: Set up Python for bundled OCR runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build bundled PP-StructureV3 runtime
        shell: bash
        working-directory: apps/desktop
        run: npm run ocr:runtime:build
        env:
          SIGMA_OCR_PLATFORM: ${{ matrix.platform }}
          SIGMA_OCR_ARCH: ${{ matrix.platform == 'mac' && 'arm64' || 'x64' }}

      # The release tag and all workspace versions must agree.
      - name: Validate release version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
              echo "tag ${GITHUB_REF_NAME} とSigma Studio version v${version}が一致しません。" >&2
              exit 1
            fi
          else
            echo "manual release: channel=${{ steps.channel.outputs.channel }} version=v${version}"
          fi
          if [[ "${{ steps.channel.outputs.channel }}" == "beta" && "${version}" != *"-beta."* ]]; then
            echo "Beta release requires a -beta.N package version (got ${version})." >&2
            exit 1
          fi
          if [[ "${{ steps.channel.outputs.channel }}" == "stable" && "${version}" == *"-beta."* ]]; then
            echo "Stable release cannot use a -beta.N package version." >&2
            exit 1
          fi
          npm run version:check

      - name: Install dependencies
        run: npm ci

      - name: Verify cross-process file locking
        run: npm --workspace @sigma-studio/desktop run test -- file-lock

      - name: Build renderer + electron bundle
        run: npm --workspace @sigma-studio/desktop run electron:prepare
        env:
          # TypeScript validation exceeds Node 20's default ~2 GiB heap on macOS.
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Build and publish installer
        working-directory: apps/desktop
        run: npx --no-install electron-builder --${{ matrix.platform }} --publish never --config electron-builder.config.cjs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CONTENT_RULES: ${{ secrets.RELEASE_CONTENT_RULES }}
          SIGMA_STUDIO_REQUIRE_RELEASE_AUDIT: ${{ secrets.RELEASE_CONTENT_RULES != '' && 'true' || 'false' }}
          SIGMA_STUDIO_BETA_BUILD: ${{ steps.channel.outputs.channel == 'beta' && 'true' || 'false' }}
          # macOS signing + notarization. Scoped to the mac job so the Windows
          # build never mistakes the .p12 for a Windows cert. Public macOS
          # releases require these secrets; missing values fail the mac job.
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
          SIGMA_STUDIO_REQUIRE_MAC_SIGNING: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK != '' && secrets.MAC_CSC_KEY_PASSWORD != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' && 'true' || 'false' }}

      - name: Install and launch Windows installer
        if: matrix.platform == 'win'
        shell: pwsh
        working-directory: apps/desktop
        run: |
          $installer = Get-ChildItem -Path release -Filter '*.exe' | Where-Object { $_.Name -notmatch 'uninstaller' } | Select-Object -First 1
          if (-not $installer) { throw "Windows installer artifact was not found." }
          $installDir = Join-Path $env:RUNNER_TEMP 'sigma-studio-install'
          if (Test-Path $installDir) { Remove-Item -Recurse -Force $installDir }
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Windows installer exited with code $($process.ExitCode)." }
          $app = Join-Path $installDir 'Sigma Studio.exe'
          if (-not (Test-Path $app)) {
            $app = Get-ChildItem -Path $installDir -Filter '*.exe' -Recurse | Where-Object { $_.Name -notmatch 'unins|uninstall' } | Select-Object -First 1 | ForEach-Object FullName
          }
          if (-not $app -or -not (Test-Path $app)) { throw "Installed Sigma Studio executable was not found." }
          $launched = Start-Process -FilePath $app -PassThru
          Start-Sleep -Seconds 12
          if ($launched.HasExited -and $launched.ExitCode -ne 0) {
            throw "Sigma Studio exited during launch smoke test with code $($launched.ExitCode)."
          }
          if (-not $launched.HasExited) {
            Stop-Process -Id $launched.Id -Force
          }

      - name: Upload platform release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: apps/desktop/release/*
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish complete release
    needs: [prepare, release]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-mac
          path: release-assets/mac

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-win
          path: release-assets/win

      - name: Assemble and validate updater assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets/final
          for platform in mac win; do
            while IFS= read -r -d '' file; do
              name="$(basename "$file")"
              case "$name" in
                latest*.yml|*.dmg|*.dmg.blockmap|*.zip|*.zip.blockmap|*.exe|*.exe.blockmap|*.appx|*.appxupload|*.msix) ;;
                *) continue ;;
              esac
              target="release-assets/final/$name"
              if [[ -e "$target" ]]; then
                echo "Duplicate release asset basename: $name" >&2
                exit 1
              fi
              cp "$file" "$target"
            done < <(find "release-assets/$platform" -maxdepth 1 -type f -print0)
          done
          test -f release-assets/final/latest.yml
          test -f release-assets/final/latest-mac.yml
          find release-assets/final -maxdepth 1 -type f -printf '%f\n' | sort
          count="$(find release-assets/final -maxdepth 1 -type f | wc -l)"
          if [[ "$count" -lt 6 ]]; then
            echo "Expected update metadata and installers from both platforms; found only $count assets." >&2
            exit 1
          fi

      - name: Create or resume draft and publish once
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ needs.prepare.outputs.version }}
          RELEASE_REF: ${{ needs.prepare.outputs.ref }}
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          title="Sigma Studio $tag"
          notes="Sigma Studio $tag. See the repository changelog and release notes for details."

          if gh release view "$tag" --json isDraft --jq '.isDraft' >/tmp/release-is-draft 2>/dev/null; then
            if [[ "$(cat /tmp/release-is-draft)" != "true" ]]; then
              echo "Release $tag already exists and is published; refusing to overwrite a public release." >&2
              exit 1
            fi
            gh release upload "$tag" release-assets/final/* --clobber
            if [[ "$RELEASE_CHANNEL" == "beta" ]]; then
              gh release edit "$tag" --title "$title" --notes "$notes" --prerelease --draft=false
            else
              gh release edit "$tag" --title "$title" --notes "$notes" --draft=false
            fi
          else
            if [[ "$RELEASE_CHANNEL" == "beta" ]]; then
              gh release create "$tag" release-assets/final/* --target "$RELEASE_REF" --title "$title" --notes "$notes" --draft --prerelease
            else
              gh release create "$tag" release-assets/final/* --target "$RELEASE_REF" --title "$title" --notes "$notes" --draft
            fi
            gh release edit "$tag" --draft=false
          fi

