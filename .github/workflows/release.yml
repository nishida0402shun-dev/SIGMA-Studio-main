name: Release

# Builds the desktop app for macOS and Windows and uploads installers, update
# metadata, and blockmaps to a GitHub Release. A normal push to main automatically
# bumps the patch version, creates the matching tag, and publishes the release.
# Version tags and manual dispatch remain supported. See docs/distribution.md
# for the full release checklist.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - beta

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.release.outputs.ref }}
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Prepare release ref
        id: release
        shell: bash
        run: |
          set -euo pipefail
          channel="stable"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="$(node -p "require('./package.json').version")"
            ref="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="$(node -p "require('./package.json').version")"
            ref="${GITHUB_SHA}"
            channel="${{ inputs.channel }}"
          else
            npm run version:set -- patch
            version="$(node -p "require('./package.json').version")"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json apps/desktop/package.json package-lock.json packages/viewer/package.json packages/editor/package.json examples/editor-react18/package.json
            git commit -m "chore(release): bump version to ${version}"
            git push origin HEAD:main
            git tag "v${version}"
            git push origin "v${version}"
            ref="v${version}"
          fi

          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"

  release:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Resolve release channel
        id: channel
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" == *"-beta."* ]]; then
              channel="beta"
            else
              channel="stable"
            fi
          else
            channel="${{ needs.prepare.outputs.channel }}"
          fi
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"
          echo "SIGMA_STUDIO_BETA_BUILD=$([[ "${channel}" == "beta" ]] && echo true || echo false)" >> "${GITHUB_ENV}"

      # The release tag and all workspace versions must agree.
      - name: Validate release version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
              echo "tag ${GITHUB_REF_NAME} とSigma Studio version v${version}が一致しません。" >&2
              exit 1
            fi
          else
            echo "manual release: channel=${{ steps.channel.outputs.channel }} version=v${version}"
          fi
          if [[ "${{ steps.channel.outputs.channel }}" == "beta" && "${version}" != *"-beta."* ]]; then
            echo "Beta release requires a -beta.N package version (got ${version})." >&2
            exit 1
          fi
          if [[ "${{ steps.channel.outputs.channel }}" == "stable" && "${version}" == *"-beta."* ]]; then
            echo "Stable release cannot use a -beta.N package version." >&2
            exit 1
          fi
          npm run version:check

      - name: Install dependencies
        run: npm ci

      - name: Verify cross-process file locking
        run: npm --workspace @sigma-studio/desktop run test -- file-lock

      - name: Apply upstream macOS keychain fix
        if: matrix.platform == 'mac'
        run: node scripts/patch-electron-builder-keychain.mjs

      - name: Build renderer + electron bundle
        run: npm --workspace @sigma-studio/desktop run electron:prepare
        env:
          # TypeScript validation exceeds Node 20's default ~2 GiB heap on macOS.
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Build and publish installer
        working-directory: apps/desktop
        run: npx --no-install electron-builder --${{ matrix.platform }} --publish always --config electron-builder.config.cjs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CONTENT_RULES: ${{ secrets.RELEASE_CONTENT_RULES }}
          SIGMA_STUDIO_REQUIRE_RELEASE_AUDIT: ${{ secrets.RELEASE_CONTENT_RULES != '' && 'true' || 'false' }}
          SIGMA_STUDIO_BETA_BUILD: ${{ steps.channel.outputs.channel == 'beta' && 'true' || 'false' }}
          # macOS signing + notarization. Scoped to the mac job so the Windows
          # build never mistakes the .p12 for a Windows cert. Public macOS
          # releases require these secrets; missing values fail the mac job.
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
          SIGMA_STUDIO_REQUIRE_MAC_SIGNING: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK != '' && secrets.MAC_CSC_KEY_PASSWORD != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' && 'true' || 'false' }}
