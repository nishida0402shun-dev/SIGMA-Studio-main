name: Regenerate dependency lockfile

# Keep the root lockfile synchronized with desktop dependencies.

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/package.json"
      - ".github/workflows/regenerate-lockfile.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: rm -f package-lock.json
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --include=optional
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: regenerate dependency lockfile"
          git push
