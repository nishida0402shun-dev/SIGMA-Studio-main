name: Checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-tests:
    name: Desktop build and unit checks
    # Unit tests assert POSIX path spellings in several architecture contracts.
    # Keep this platform-neutral validation on Linux; desktop support remains Windows-only.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run audit:production
      - run: npm run version:check
      - run: npm run test:scripts
      - run: npm exec --workspace @sigma-studio/desktop -- next typegen
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run core:test
      - run: npm run core:typecheck
      - run: npm --workspace @sigma-studio/core run licenses:check
      - run: npm --workspace @sigma-studio/desktop run electron:prepare
      - run: npm --workspace @sigma-studio/desktop run test -- --maxWorkers=2 --testTimeout=30000

  windows-desktop-smoke:
    name: Windows desktop build and Electron smoke test
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm --workspace @sigma-studio/desktop run electron:prepare
      - name: Build unpacked Windows app without publishing
        run: npm exec --workspace @sigma-studio/desktop -- electron-builder --config electron-builder.config.cjs --win --dir --publish never
      - name: Verify bundled SIGMA Core MCP stdio round-trip
        run: npm --workspace @sigma-studio/desktop run test -- mcp/source-material-mcp-server-stdio.integration.test.ts
        env:
          SIGMA_CORE_MCP_PACKAGED: "true"
      - name: Build Windows NSIS installer without publishing
        run: npm exec --workspace @sigma-studio/desktop -- electron-builder --config electron-builder.config.cjs --win nsis --publish never
      - name: Install NSIS build and verify installed Electron runtime
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path apps/desktop/release -Filter "Sigma-Studio-*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "NSIS installer was not generated."
          }

          $installDir = Join-Path $env:RUNNER_TEMP "sigma-studio-nsis-install"
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "NSIS installer exited with code $($install.ExitCode)."
          }

          $app = Join-Path $installDir "Sigma Studio.exe"
          $asar = Join-Path $installDir "resources/app.asar"
          if (-not (Test-Path -LiteralPath $app -PathType Leaf)) {
            throw "Installed Sigma Studio executable was not found."
          }
          if (-not (Test-Path -LiteralPath $asar -PathType Leaf)) {
            throw "Installed app.asar was not found."
          }

          $versionInfo = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($app)
          if (-not $versionInfo.FileVersion -or -not $versionInfo.ProductName) {
            throw "Installed Sigma Studio executable version metadata is missing."
          }
          Write-Host "Installed $($versionInfo.ProductName) $($versionInfo.FileVersion)"
          "SIGMA_CORE_MCP_PACKAGED_APP_DIR=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify Core MCP from the installed NSIS app
        run: npm --workspace @sigma-studio/desktop run test -- mcp/source-material-mcp-server-stdio.integration.test.ts
        env:
          SIGMA_CORE_MCP_PACKAGED: "true"
      - name: Run Electron smoke test on the supported desktop OS
        run: npm --workspace @sigma-studio/desktop run test:e2e:electron -- tests/electron/open-document.spec.ts tests/electron/sigma-core-mcp.spec.ts

  public-packages:
    name: Public package build and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # Viewer declarations must exist before Editor's public contract checks.
      - run: npm run editor:build
      - run: npm run viewer:typecheck
      - run: npm run editor:typecheck
      - run: npm run viewer:test
      - run: npm --workspace @sigma-studio/editor run test
      - run: npm --workspace @sigma-studio/editor-react18-example run build
      - run: npm exec --workspace @sigma-studio/desktop -- playwright install --with-deps chromium
      - run: npm run test:public-browser
      - name: Inspect the public tarballs without publishing
        run: npm pack --workspace @sigma-studio/viewer --workspace @sigma-studio/editor --dry-run --ignore-scripts

  file-lock:
    name: File locking (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Verify ownership and real process recovery
        run: npm --workspace @sigma-studio/desktop run test -- file-lock
      - name: Load the native lock in the shipped Electron runtime
        run: npm exec --workspace @sigma-studio/desktop -- cross-env ELECTRON_RUN_AS_NODE=1 electron scripts/check-native-lock.cjs
