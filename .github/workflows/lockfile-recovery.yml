name: Temporary lockfile recovery

on:
  push:
    branches:
      - test/chatgpt-github-write

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Regenerate lockfile from package manifests
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify clean install
        shell: bash
        run: |
          set +e
          npm ci --ignore-scripts > npm-ci.log 2>&1
          code=$?
          echo "npm ci exit code: $code" >> npm-ci.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add npm-ci.log
          git commit -m "chore: record npm ci verification [skip ci]" || true
          git push || true
          exit $code
      - name: Commit generated lockfile
        if: always()
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize package lockfile [skip ci]" || true
          git push || true
