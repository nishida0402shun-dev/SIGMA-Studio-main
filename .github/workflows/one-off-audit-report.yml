name: One-off audit report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Audit
        run: |
          npm audit --json > audit.json || true
          node -e 'const a=require("./audit.json"); console.log(JSON.stringify({metadata:a.metadata,vulnerabilities:a.vulnerabilities},null,2))'
      - name: Remove this workflow
        run: |
          rm -f .github/workflows/one-off-audit-report.yml audit.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/one-off-audit-report.yml
          git commit -m "chore: remove one-off audit workflow" || true
          git push || true
